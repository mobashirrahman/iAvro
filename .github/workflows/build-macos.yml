name: Build macOS Input Method

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - fix/bug-series
    tags:
      - "v*"
  pull_request:

env:
  # Xcode 26.2 is the newest build that ships the macOS 26.2 SDK, which is the
  # SDK the app is developed against. Override to test other toolchains.
  XCODE_VERSION: "26.2"

jobs:
  build:
    # macos-26 is Apple Silicon and carries the full Xcode 26.x line
    # (26.0.1 - 26.6). macos-15 only ships up to 26.0.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode ${XCODE_VERSION} not installed on this image"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        run: pod install

      - name: Run regression tests
        run: Tests/run_tests.sh

      - name: Check generated word list is in sync
        run: python3 tools/build_extra_words.py --check

      - name: Check release notes exist for this version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist","rb"))["CFBundleShortVersionString"])')
          python3 tools/release_notes.py "$VERSION" > /dev/null
          echo "CHANGELOG.md has a section for $VERSION"

      - name: Build (universal)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace AvroKeyboard.xcworkspace \
            -scheme "Avro Keyboard" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Verify universal binary
        run: |
          set -euo pipefail
          BIN="build/Build/Products/Release/Avro Keyboard.app/Contents/MacOS/Avro Keyboard"
          if [ ! -f "$BIN" ]; then
            echo "Binary not found at $BIN"
            find build -maxdepth 5 -name "*.app"
            exit 1
          fi
          echo "--- architectures ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64" || { echo "FAIL: missing x86_64 slice"; exit 1; }
          lipo -info "$BIN" | grep -q "arm64"  || { echo "FAIL: missing arm64 slice"; exit 1; }
          echo "OK: universal x86_64 + arm64"
          echo "--- minimum OS per slice ---"
          for arch in x86_64 arm64; do
            printf '%-8s ' "$arch"
            otool -arch "$arch" -l "$BIN" \
              | grep -A4 -E "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION" \
              | grep -E "minos|sdk" | tr '\n' ' '
            echo
          done

      - name: Verify hardened runtime
        run: |
          set -euo pipefail
          BIN="build/Build/Products/Release/Avro Keyboard.app/Contents/MacOS/Avro Keyboard"
          FLAGS=$(codesign -d --verbose=2 "$BIN" 2>&1 || true)
          echo "$FLAGS"
          if echo "$FLAGS" | grep -q "flags=.*runtime"; then
            echo "OK: hardened runtime enabled"
          else
            echo "FAIL: hardened runtime missing (notarization will be rejected)"
            exit 1
          fi

      - name: Verify Release is not a debug build
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Avro Keyboard.app"
          echo "--- entitlements ---"
          codesign -d --entitlements - "$APP" 2>&1 | sed 's/^/  /' || true
          if codesign -d --entitlements - "$APP" 2>&1 | grep -q "get-task-allow"; then
            echo "::error::get-task-allow present: this Release build would be debuggable."
            echo "It is injected for development signing; keep"
            echo "CODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO on the Release configuration."
            exit 1
          fi
          echo "OK: no debugging entitlement"

      - name: Verify Info.plist
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Avro Keyboard.app"
          plutil -lint "$APP/Contents/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist")
          echo "CFBundleName=$NAME"
          [ "$NAME" = "Avro Keyboard" ] || { echo "FAIL: unexpected CFBundleName"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :InputMethodServerControllerClass" \
            "$APP/Contents/Info.plist" >/dev/null
          echo "OK: Info.plist sane"

      - name: Package App
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/Avro Keyboard.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "AvroKeyboard-macOS.zip"

      # Runs here rather than in the release job because sign_update is a macOS
      # binary and the pod that ships it is only present after pod install.
      # Skipped when the secret is absent so forks still build; Sparkle will
      # reject an unsigned archive, so the feed is only written when signed.
      # Signing and appcast generation happen here, not in the release job,
      # because sign_update and generate_appcast are macOS binaries and the pod
      # that ships them is only present after pod install.
      - name: Sign and write the update feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::notice::SPARKLE_PRIVATE_KEY not set - releasing unsigned, with no update feed"
            exit 0
          fi
          TOOL_DIR="Pods/Sparkle/bin"
          [ -x "$TOOL_DIR/generate_appcast" ] || { echo "::error::generate_appcast missing"; exit 1; }

          # generate_appcast reads the archive, so the feed entry gets its
          # version, minimum system version and signature from the real build.
          # The prefix must place the download on the release asset, and the
          # archive name must match that asset.
          FEED_DIR="update-feed"
          mkdir -p "$FEED_DIR"
          cp "AvroKeyboard-macOS.zip" "$FEED_DIR/AvroKeyboard-macOS.zip"
          echo "$SPARKLE_PRIVATE_KEY" \
            | "$TOOL_DIR/generate_appcast" --ed-key-file - \
                --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
                "$FEED_DIR"
          cp "$FEED_DIR/appcast.xml" appcast.xml
          echo "--- appcast.xml ---"
          cat appcast.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvroKeyboard-macOS
          path: |
            AvroKeyboard-macOS.zip
            appcast.xml
          if-no-files-found: warn

  # Tag-driven release. Uses no Apple credentials: the app is distributed
  # ad-hoc signed, and users approve it once via right-click -> Open. See the
  # install section in README.md.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: AvroKeyboard-macOS
          path: dist

      # PlistBuddy is macOS-only and this job runs on Linux, so the version is
      # read with plistlib and published once for the steps below.
      # PlistBuddy is macOS-only and this job runs on Linux, so the version is
      # read with plistlib and published once for the steps below.
      - name: Read and verify version
        run: |
          set -euo pipefail
          SHORT=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist","rb"))["CFBundleShortVersionString"])')
          BUILD=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist","rb"))["CFBundleVersion"])')
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=v$TAG  CFBundleShortVersionString=$SHORT  CFBundleVersion=$BUILD"
          if [ "$TAG" != "$SHORT" ]; then
            echo "::error::Tag v$TAG does not match CFBundleShortVersionString '$SHORT'."
            echo "Bump Info.plist before tagging, or retag."
            exit 1
          fi
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          # Notes come from CHANGELOG.md, not from the annotated tag: the tag
          # object is not available on the runner, and reading it published the
          # tagged commit's message instead. The change log is the canonical
          # record and is present in the working tree.
          python3 tools/release_notes.py "$SHORT" > "$NOTES" || {
            echo "::error::CHANGELOG.md has no section for $SHORT."
            echo "Add one before tagging, so the release has real notes."
            exit 1
          }
          # Standing install and testing instructions follow the change log.
          printf '\n' >> "$NOTES"
          cat .github/release-footer.md >> "$NOTES"
          echo "--- release notes ---"
          cat "$NOTES"
          FEED=""
          [ -f dist/appcast.xml ] && FEED="dist/appcast.xml"
          if [ -z "$FEED" ]; then
            echo "::notice::No feed to publish (unsigned release)"
          fi
          gh release create "$GITHUB_REF_NAME" dist/AvroKeyboard-macOS.zip $FEED \
            --title "Avro Keyboard $SHORT" \
            --notes-file "$NOTES"
          echo "::notice::Release $GITHUB_REF_NAME published"

      # The feed is a generated artifact, not history, so it lives on its own
      # branch: releasing then never rewrites master and never races with a
      # push to it. The previous version of this step looked for appcast.xml at
      # the repository root while the artifact lands in dist/, so its `if:`
      # was always false and the feed was never published at all.
      - name: Publish the update feed
        if: hashFiles('dist/appcast.xml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # python3, not xmllint: this job runs on Linux, where xmllint is
          # not installed. The macOS job previously used it too, but that step
          # was always skipped, so the mistake went unnoticed.
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("dist/appcast.xml")'
          echo "feed XML is well formed"

          work="$(mktemp -d)"
          cd "$work"
          git init -q -b appcast
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/dist/appcast.xml" appcast.xml
          git add appcast.xml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update appcast for $GITHUB_REF_NAME"
          git push -q --force origin appcast

          # Fetch the exact URL the app uses, so a feed that is not actually
          # reachable fails the release instead of failing silently later.
          FEED_URL=$(python3 -c 'import plistlib; print(plistlib.load(open("'"$GITHUB_WORKSPACE"'/Info.plist","rb"))["SUFeedURL"])')
          for attempt in 1 2 3 4 5; do
            if curl -sSfL "$FEED_URL" | grep -q "<rss"; then
              echo "::notice::feed is live at $FEED_URL"
              exit 0
            fi
            echo "attempt $attempt: feed not readable yet, retrying"
            sleep 10
          done
          echo "::error::$FEED_URL did not serve the feed."
          echo "Check that the appcast branch exists and SUFeedURL matches it."
          exit 1
